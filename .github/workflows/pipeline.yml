name: CI/CD Pipeline

on:
    push:
        branches: ["main"]
        tags: ["v*"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        name: Run Tests & Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .
                  pip install pytest ruff

            - name: Lint with ruff
              run: ruff check .

            - name: Run tests with pytest
              env:
                  PYTHONPATH: src
              run: pytest -v

    publish-test:
        name: Publish to TestPyPI
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            id-token: write # Obavezno za Trusted Publishing
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Build package
              run: |
                  python -m pip install build
                  python -m build

            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

    publish-official:
        name: Publish to Official PyPI
        needs: test
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            id-token: write # Obavezno za Trusted Publishing
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Build package
              run: |
                  python -m pip install build
                  python -m build

            - name: Publish to Official PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  skip-existing: true # Sigurnosna mjera da ne pregaziš verzije

    deploy-docs:
        name: Deploy Documentation
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install documentation tools
              run: |
                  python -m pip install --upgrade pip
                  pip install mkdocs-material mkdocstrings[python]

            - name: Deploy to GitHub Pages
              run: mkdocs gh-deploy --force
